schema:
  schema_id: jyut6ping3
  version: "2026.08.31"

switches:
- name: full_shape
  states: ["半", "全"]
  reset: 1
- name: simplification
  states: ["繁", "简"]
  reset: 0

engine:
  processors:
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - script_translator
  filters:
  - simplifier
  - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " "
  algebra:
  # 將碼表中的編碼複製一份，然後將數字刪去。
  # 由於只有粵拼的編碼有數字，所以此行作用為忽略聲調。
  - derive/\d//
  # 然後，將碼表中有數字的編碼更換成英文字。
  # 原因是數字會和選字鍵相衝。
  - xform/1/v/                  # 陰平
  - xform/4/vv/                 # 陽平
  - xform/2/x/                  # 陰上
  - xform/5/xx/                 # 陽上
  - xform/3/q/                  # 陰去
  - xform/6/qq/                 # 陽去

abc_segmentor:
  extra_tags:
  - translator_jyut6ping3

translator:
  tag: translator_jyut6ping3
  dictionary: jyut6ping3
  prism: jyut6ping3
  preedit_format:
  # 最後，在顯示時，還原聲調。
  - xform/([aeiouymngptk])vv/${1}4/
  - xform/([aeiouymngptk])xx/${1}5/
  - xform/([aeiouymngptk])qq/${1}6/
  - xform/([aeiouymngptk])v/${1}1/
  - xform/([aeiouymngptk])x/${1}2/
  - xform/([aeiouymngptk])q/${1}3/

simplifier:
  tips: all

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
