schema:
  schema_id: jyut6ping3
  version: "2026.08.31"

switches:
- name: full_shape
  states: ["半", "全"]
  reset: 0
- name: simplification
  states: ["繁", "简"]
  reset: 0

engine:
  processors:
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - script_translator
  filters:
  - simplifier
  - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " "
  algebra:
  - derive/\d//
  - xform/1/v/
  - xform/4/vv/
  - xform/2/x/
  - xform/5/xx/
  - xform/3/q/
  - xform/6/qq/

abc_segmentor:
  extra_tags:
  - translator_jyut6ping3

translator:
  tag: translator_jyut6ping3
  dictionary: jyut6ping3
  prism: jyut6ping3
  preedit_format:
  - xform/([aeiouymngptk])vv/${1}4/
  - xform/([aeiouymngptk])xx/${1}5/
  - xform/([aeiouymngptk])qq/${1}6/
  - xform/([aeiouymngptk])v/${1}1/
  - xform/([aeiouymngptk])x/${1}2/
  - xform/([aeiouymngptk])q/${1}3/

simplifier:
  tips: all

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
