config_version: 0.50

switcher:
  abbreviate_options: false
  fold_options: true
  caption: "〔方案選單〕"
  hotkeys:
  - "Control+grave"
  option_list_separator: "/"

schema_list:
- schema: cangjie5_jyut6ping3

menu:
  page_size: 9

key_binder:
  bindings:
  - {accept: "Control+g", send: Escape, when: composing}
  - {accept: "Control+n", send: Down, when: has_menu}
  - {accept: "Control+p", send: Up, when: has_menu}

# Many schemas are written as
#
# recognizer:
#   import_preset: default
#
# So this section must appear.
recognizer:
  patterns: {}

punctuator:
  full_shape:
    " ": "　"
    "!": "！"
    "\"": {pair: ["“", "”"]}
    "#": "＃"
    "$": "＄"
    "%": "％"
    "&": "＆"
    "'": {pair: ["‘", "’"]}
    "(": "（"
    ")": "）"
    "*": "＊"
    "+": "＋"
    ",": "，"
    "-": "－"
    ".": "。"
    "/": "／"
    ":": "："
    ";": "；"
    "<": ["《", "〈", "«", "‹"]
    "=": "＝"
    ">": ["》", "〉", "»", "›"]
    "?": "？"
    "@": "＠"
    "[": ["「", "【", "〔", "［"]
    "\\": "、"
    "]": ["」", "】", "〕", "］"]
    "^": "＾"
    "_": "＿"
    "`": "｀"
    "{": ["『", "〖", "｛"]
    "|": "｜"
    "}": ["』", "〗", "｝"]
    "~": "～"
  half_shape:
    "!": "！"
    "\"": {pair: ["“", "”"]}
    "#": "#"
    "$": "$"
    "%": "%"
    "&": "&"
    "'": {pair: ["‘", "’"]}
    "(": "（"
    ")": "）"
    "*": "*"
    "+": "+"
    ",": "，"
    "-": "－"
    ".": "。"
    "/": "/"
    ":": "："
    ";": "；"
    "<": "<"
    "=": "="
    ">": ">"
    "?": "？"
    "@": "@"
    "[": ["「", "【", "〔", "［"]
    "\\": "、"
    "]": ["」", "】", "〕", "］"]
    "^": "^"
    "_": "_"
    "`": "`"
    "{": ["『", "〖", "｛"]
    "|": "|"
    "}": ["』", "〗", "｝"]
    "~": "～"
