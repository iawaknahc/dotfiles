schema:
  schema_id: cangjie5_jyut6ping3
  name: "五代倉頡 粵拼"
  version: "2026.08.31"
  dependencies:
  # Must include this line to refer to jyut6ping3.schema.yaml
  # so that jyut6ping3.reverse.bin is generated.
  - jyut6ping3

switches:
- name: full_shape
  states: ["半", "全"]
  reset: 0
- name: simplification
  states: ["繁", "简"]
  reset: 0
- name: prediction
  states: ["關閉預測", "開啓預測"]
  reset: 1
- name: extended_charset
  states: ["常用香港字", "所有漢字"]
  reset: 0

engine:
  processors:
  - recognizer
  - predictor
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - table_translator
  - script_translator@translator_jyut6ping3
  - lua_translator@snippet_translator
  - lua_translator@unicode_translator
  - lua_translator@numeral_translator
  - predict_translator
  filters:
  - lua_filter@prediction_preedit_filter
  - lua_filter@unicode_cjk_extension_filter
  - simplifier
  # numeral_translator output the same candidate with different comments very often.
  # To avoid confusion, we no longer remove duplicates in candidates.
  #- uniquifier
  - lua_filter@reverse_lookup_filter_cangjie5
  - lua_filter@reverse_lookup_filter_jyut6ping3

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  algebra:
  - derive/\d//
  - xform/1/v/
  - xform/4/vv/
  - xform/2/x/
  - xform/5/xx/
  - xform/3/q/
  - xform/6/qq/

translator:
  dictionary: cangjie5_hk
  prism: cangjie5_jyut6ping3
  # enable_sentence is true by default.
  # Typically Cangjie input methods expect the user to type character by character.
  enable_sentence: false
  comment_format:
  - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜重|"
  # Based on my testing, I need to set this to 2.0 and jyut6ping3 to 0.0
  # in order for 水 and 人 appear as the first candidate.
  initial_quality: 2.0

translator_jyut6ping3:
  dictionary: jyut6ping3
  spelling_hints: 99
  always_show_comments: false
  preedit_format:
  - xform/([aeiouymngptk])vv/${1}4/
  - xform/([aeiouymngptk])xx/${1}5/
  - xform/([aeiouymngptk])qq/${1}6/
  - xform/([aeiouymngptk])v/${1}1/
  - xform/([aeiouymngptk])x/${1}2/
  - xform/([aeiouymngptk])q/${1}3/
  initial_quality: 0.0

simplifier:
  tips: all

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    unicode: "^U.*$"
    numeral: "^D.*$"

predictor:
  db: predict.db
  max_candidates: 0
  max_iterations: 1
