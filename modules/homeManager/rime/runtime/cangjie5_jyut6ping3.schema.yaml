schema:
  schema_id: cangjie5_jyut6ping3
  name: "五代倉頡 粵拼"
  version: "2026.08.31"
  dependencies:
  # Must include this line to refer to jyut6ping3.schema.yaml
  # so that jyut6ping3.reverse.bin is generated.
  - jyut6ping3

engine:
  __include: cangjie5_jyut6ping3.yaml:/engine
  translators:
  - punct_translator
  - table_translator
  - script_translator@translator_jyut6ping3
  - lua_translator@snippet_translator
  - lua_translator@unicode_translator
  - lua_translator@numeral_translator
  # librime-predict does not work quite well in Hamster.
  # When the prediction is showing, pressing any other key will commit the prediction.
  # This is certainly not what we want.
  # We have to disable prediction, otherwise, prediction will stay in the way we type.
  #- predict_translator
  filters:
  #- lua_filter@prediction_preedit_filter
  - lua_filter@unicode_cjk_extension_filter
  - simplifier
  # numeral_translator output the same candidate with different comments very often.
  # To avoid confusion, we no longer remove duplicates in candidates.
  #- uniquifier
  - lua_filter@reverse_lookup_filter_cangjie5
  - lua_filter@reverse_lookup_filter_jyut6ping3

translator:
  dictionary: cangjie5_hk
  prism: cangjie5_jyut6ping3
  # enable_sentence is true by default.
  # Typically Cangjie input methods expect the user to type character by character.
  enable_sentence: false
  comment_format:
  - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜重|"
  # Based on my testing, I need to set this to 2.0 and jyut6ping3 to 0.0
  # in order for 水 and 人 appear as the first candidate.
  initial_quality: 2.0

translator_jyut6ping3:
  spelling_hints: 99
  always_show_comments: false
  initial_quality: 0.0
  __include: cangjie5_jyut6ping3.yaml:/translator_jyut6ping3

__include: cangjie5_jyut6ping3.yaml:/schema_root
